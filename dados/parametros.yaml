  - id: hotel_tem_1_diaria                    # NOVO
    regra: "fração de estadias de hotel < 24h dentro de ±5pp do peso declarado"
  - id: inadimplentes_reincidentes            # NOVO
    regra: "≥50% dos clientes com atraso aparecem em mais de um mês"
  - id: ocupacao_dentro_da_capacidade         # NOVO — era o sintoma do bug de pareamento
