  - id: terreo_fora_da_janela
    esperado: 0
  - id: moto_pelo_terreo
    esperado: 0
  - id: pix_no_totem                          # NOVO — falhava no v12 (21 casos)
    esperado: 0
  - id: totem_forma_permitida                 # NOVO — generaliza o anterior
